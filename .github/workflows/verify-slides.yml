name: Verify slides

on:
  push:
    branches: [main]
    paths:
      - "slides/**"
      - "scripts/verify-slides.sh"
      - "Makefile"
      - ".github/workflows/verify-slides.yml"
  pull_request:
    paths:
      - "slides/**"
      - "scripts/verify-slides.sh"
      - "Makefile"
      - ".github/workflows/verify-slides.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install weasyprint and tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y weasyprint tmux

      - name: Install presenterm
        run: |
          version=$(curl -fsSL https://api.github.com/repos/mfontanini/presenterm/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          curl -fsSL -o presenterm.tar.gz \
            "https://github.com/mfontanini/presenterm/releases/download/${version}/presenterm-${version#v}-x86_64-unknown-linux-gnu.tar.gz"
          tar xzf presenterm.tar.gz
          sudo mv presenterm /usr/local/bin/
          presenterm --version

      - name: Verify slides can be exported to PDF
        run: make verify
