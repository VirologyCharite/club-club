[project]
name = "club-club"
version = "0.1.0"
description = "Command-line UNIX for Bioinformatics club"
readme = "README.md"
authors = [
    { name = "terrycojones", email = "terence.jones@charite.de" }
]
requires-python = ">=3.13"
dependencies = [
    "dark-matter>=7.4.0",
]

[project.scripts]
club-club = "club_club:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
